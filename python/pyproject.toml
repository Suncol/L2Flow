[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "l2flow-factor"
version = "0.1.0"
description = "Repository-local L2Flow factor and historical-storage primitives"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
history = ["pyarrow"]

[tool.setuptools]
packages = ["l2flow_factor", "l2flow_history"]
